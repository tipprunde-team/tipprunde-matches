spring.application.name=tipprunde-matches
# Heroku setzt PORT selbst, lokal 8082 (Core 8080, GraphQL 8081)
server.port=${PORT:8082}
# Nur der Health-Check ist erreichbar
management.endpoints.web.exposure.include=health

# football-data.org v4; Token nur aus der Umgebungsvariable FOOTBALL_DATA_TOKEN
app.football-data.base-url=https://api.football-data.org/v4
app.football-data.token=${FOOTBALL_DATA_TOKEN:}
app.football-data.competition=BL1
# Free-Tarif: höchstens 10 Anfragen pro Minute, also mindestens 6 s Abstand
app.football-data.min-interval=6s
app.football-data.max-attempts=3
app.football-data.connect-timeout=5s
app.football-data.read-timeout=10s
